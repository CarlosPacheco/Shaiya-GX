; =============================================================================
;  GUILD HOUSE  -  prices, upkeep and bonuses
; =============================================================================
;  How it works
;   * A guild buys its house once (HouseCost) and pays BaseUpkeep etin plus the
;     upkeep of every service at its current level after each guild ranking.
;   * Each service section lists its levels as
;         LevelN = Field value, Field value, ...
;     Level 0 is "not upgraded". Only levels 1 and up can have Upgrade / Upkeep.
;   * Upgrade  = etin paid to reach that level.
;     Upkeep   = etin paid every settlement while the guild holds that level.
;   * A service applies to every NPC of its KIND (all weapon merchants, all
;     gatekeepers, ...). Individual NPC ids are not used any more.
;   * Prices are multipliers: 0.90 means 10% off, 1.0 means no change.
;   * Missing lines keep the built-in defaults. Lines may be commented with ';'.
; =============================================================================

[House]
; Gold the master pays to found a guild.
CreateGuildCost = 1000000
; Gold the master pays to buy the guild house.
HouseCost = 50000000
; Etin charged every settlement just for owning the house.
BaseUpkeep = 2000


[Portal]
; Gatekeepers inside the house.
; Fee = multiplier applied to the normal teleport fee (0.0 = free).
Level0 = Fee 0.0
Level1 = Upgrade 1000, Upkeep 200, Fee 0.0
Level2 = Upgrade 1500, Upkeep 500, Fee 0.0
Level3 = Upgrade 2000, Upkeep 800, Fee 0.0


[WeaponShop]
; Merchants that sell weapons. Price = multiplier on the item price.
Level0 = Price 0.95
Level1 = Upgrade 100, Price 0.90
Level2 = Upgrade 200, Price 0.85
Level3 = Upgrade 500, Price 0.80


[ArmorShop]
; Merchants that sell armor.
Level0 = Price 0.95
Level1 = Upgrade 100, Price 0.90
Level2 = Upgrade 200, Price 0.85
Level3 = Upgrade 500, Price 0.80


[GeneralShop]
; Merchants that sell general goods.
Level0 = Price 0.95
Level1 = Upgrade 150, Price 0.90
Level2 = Upgrade 200, Price 0.85
Level3 = Upgrade 400, Price 0.80


[PotionShop]
; Merchants that sell potions.
Level0 = Price 0.90
Level1 = Upgrade 2000, Upkeep 50, Price 0.80
Level2 = Upgrade 5000, Upkeep 200, Price 0.70
Level3 = Upgrade 10000, Upkeep 500, Price 0.60


[Blacksmith]
; Repair     = multiplier on the repair cost.
; Link       = multiplier on the gem linking / removal cost.
; LinkBonus  = extra success chance (percent points) when linking gems.
Level0 = Repair 0.99, Link 0.90, LinkBonus 0
Level1 = Upgrade 500, Upkeep 100, Repair 0.95, Link 0.80, LinkBonus 0
Level2 = Upgrade 1000, Upkeep 200, Repair 0.95, Link 0.70, LinkBonus 1
Level3 = Upgrade 2000, Upkeep 500, Repair 0.90, Link 0.60, LinkBonus 1
Level4 = Upgrade 10000, Upkeep 800, Repair 0.90, Link 0.50, LinkBonus 2
Level5 = Upgrade 15000, Upkeep 1500, Repair 0.90, Link 0.10, LinkBonus 2


[Warehouse]
; Guild warehouse. Slots = usable slots (40 per page).
Level0 = Slots 40
Level1 = Upgrade 200, Upkeep 100, Slots 80
Level2 = Upgrade 500, Upkeep 200, Slots 120
Level3 = Upgrade 1000, Upkeep 500, Slots 160
Level4 = Upgrade 2000, Upkeep 800, Slots 200
