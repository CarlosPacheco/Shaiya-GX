// GX SERVER - LIVE ALTARS, LINKED BOSSES AND COMPANIONS
// UTF-8. Comments are documentation; all active source values are unchanged.
// This file contains 9 altars and 25 linked-boss definitions. Only live records
// are kept: unused portal examples, disabled records and obsolete text are omitted.
// Mob names below come from the English client's Monster.SData. IDs, not names,
// select gameplay definitions. A zero ID means that slot has no mob.
//
// ALTARS
// [zone_MAP] selects the map for subsequent [Obelisk_NUMBER] entries.
// [Obelisk_NUMBER] = (X,Y,Z),(neutralMob,LightMob,FuryMob),initialOwner
// Owner order is 0 neutral / 1 Light / 2 Fury. Saved Keeps ownership takes
// precedence over initialOwner; editing comments does not reset the database.
// [Mob] = (X,Y,Z,radius),(neutralMob,LightMob,FuryMob),count
// Each [Mob] belongs to the immediately preceding altar. Radius randomizes X/Z
// around that spawn center. Count is the population for that individual line.
// A capture changes the variant and removes the parent's companions. Ordinary
// mobile companions wander/chase; stationary pillar guards use their mob rules.
// Captures also contribute to faction blessing. PS_GameDefs owns its blessing tiers.
//
// LINKED BOSSES (bothmob)
// [bothmob_NUMBER,(MAP,phaseCount,cycleSeconds,(portalMap,portalID))]
//     = (X,Y,Z),(phase1Mob,...,phaseNMob)
// These records are independent boss chains, NOT additional faction altars.
// The listed bosses appear one phase at a time. Their own respawn definitions
// control intermediate transitions; cycleSeconds controls the next complete
// cycle after the final kill, with the original random minute adjustment.
// Their [Mob] list contains phaseCount+1 IDs: one for each live boss phase,
// then one for the final portal-open period. Count/radius apply per [Mob] line.
// The final boss phase controls the named portal; portal map/ID are data keys,
// not X/Z coordinates. This file has no active altar-to-portal dependency lists.
//
// OPTIONAL RANDOM CYCLE (only where a live [RandomRespawn] follows a boss)
// [RandomRespawn] = (minimumMinutes,randomRangeMinutes),(X1,Y1,Z1),
//                  (X2,Y2,Z2),(X3,Y3,Z3)
// This overrides that boss's ordinary cycle with its original randomized delay
// and one of three positions. Minutes here differ from bothmob cycle SECONDS.
// See docs/wiki/obelisks.md for lifecycle, persistence and protocol details.

// ====================================================================
